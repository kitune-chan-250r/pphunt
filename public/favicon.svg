<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- PPHunt mark: the "▟█" block glyph from the header lockup on an obsidian
       terminal canvas with an amber accent, square corners to match the
       ASCII "Terminal Editorial" design. -->
  <rect width="64" height="64" fill="#09090b"/>
  <rect x="7" y="7" width="50" height="50" fill="none" stroke="#2a2a2e" stroke-width="2"/>
  <!-- ▟ : all quadrants but the upper-left -->
  <rect x="16" y="32" width="8" height="16" fill="#facc15"/>
  <rect x="24" y="16" width="8" height="16" fill="#facc15"/>
  <rect x="24" y="32" width="8" height="16" fill="#facc15"/>
  <!-- █ : full block -->
  <rect x="32" y="16" width="16" height="32" fill="#facc15"/>
</svg>
